<svg xmlns="http://www.w3.org/2000/svg" width="1920" height="1080" viewBox="0 0 1920 1080" role="img" aria-labelledby="title description">
  <title id="title">Техническая архитектура ALFA</title>
  <desc id="description">Минималистичная схема сервисов Docker Compose, локальной Ollama и потоков данных.</desc>
  <defs>
    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M32 0H0V32" fill="none" stroke="#F0F0F1" stroke-width="1"/>
    </pattern>
    <marker id="arrow" markerWidth="11" markerHeight="11" refX="9" refY="5.5" orient="auto">
      <path d="M0 0L10 5.5L0 11Z" fill="#202023"/>
    </marker>
    <marker id="arrowRed" markerWidth="11" markerHeight="11" refX="9" refY="5.5" orient="auto">
      <path d="M0 0L10 5.5L0 11Z" fill="#EF3124"/>
    </marker>
  </defs>

  <rect width="1920" height="1080" fill="#FFFFFF"/>
  <rect width="1920" height="1080" fill="url(#grid)"/>

  <g font-family="Inter, Arial, sans-serif">
    <text x="80" y="92" fill="#171719" font-size="38" font-weight="700">ALFA / ТЕХНИЧЕСКАЯ АРХИТЕКТУРА</text>
    <text x="80" y="132" fill="#777A81" font-size="19">локальный воспроизводимый стенд</text>

    <rect x="295" y="180" width="1100" height="770" rx="24" fill="#FFFFFF" fill-opacity="0.86" stroke="#AEB1B7" stroke-width="2" stroke-dasharray="10 10"/>
    <rect x="335" y="163" width="182" height="34" fill="#FFFFFF"/>
    <text x="350" y="187" fill="#777A81" font-size="16" font-weight="650" letter-spacing="1.2">DOCKER COMPOSE</text>

    <rect x="70" y="438" width="170" height="112" rx="16" fill="#171719"/>
    <text x="155" y="483" text-anchor="middle" fill="#FFFFFF" font-size="20" font-weight="650">Браузер</text>
    <text x="155" y="518" text-anchor="middle" fill="#AEB1B7" font-size="16">пользователь</text>

    <rect x="360" y="407" width="230" height="174" rx="18" fill="#FFFFFF" stroke="#202023" stroke-width="2"/>
    <rect x="360" y="407" width="8" height="174" rx="4" fill="#EF3124"/>
    <text x="398" y="455" fill="#777A81" font-family="SFMono-Regular, Menlo, monospace" font-size="16">frontend</text>
    <text x="398" y="497" fill="#171719" font-size="24" font-weight="700">React + Nginx</text>
    <text x="398" y="533" fill="#777A81" font-family="SFMono-Regular, Menlo, monospace" font-size="16">:8501</text>

    <rect x="670" y="257" width="430" height="474" rx="22" fill="#171719"/>
    <text x="712" y="304" fill="#AEB1B7" font-family="SFMono-Regular, Menlo, monospace" font-size="16">backend</text>
    <text x="712" y="350" fill="#FFFFFF" font-size="27" font-weight="700">FastAPI</text>
    <text x="1017" y="350" text-anchor="end" fill="#AEB1B7" font-family="SFMono-Regular, Menlo, monospace" font-size="16">:8000</text>
    <line x1="712" y1="377" x2="1058" y2="377" stroke="#454549" stroke-width="1"/>

    <rect x="712" y="410" width="346" height="56" rx="12" fill="#2A2A2E" stroke="#EF3124"/>
    <text x="739" y="445" fill="#FFFFFF" font-family="SFMono-Regular, Menlo, monospace" font-size="17">LangGraph agent + tools</text>

    <rect x="712" y="486" width="164" height="80" rx="12" fill="#2A2A2E"/>
    <text x="738" y="520" fill="#FFFFFF" font-size="17" font-weight="650">Hybrid RAG</text>
    <text x="738" y="546" fill="#AEB1B7" font-size="14">dense + BM25</text>

    <rect x="894" y="486" width="164" height="80" rx="12" fill="#2A2A2E"/>
    <text x="920" y="520" fill="#FFFFFF" font-size="17" font-weight="650">Ranking</text>
    <text x="920" y="546" fill="#AEB1B7" font-size="14">products</text>

    <rect x="712" y="586" width="346" height="98" rx="12" fill="#2A2A2E"/>
    <text x="738" y="624" fill="#FFFFFF" font-size="17" font-weight="650">Credit conveyor</text>
    <text x="738" y="654" fill="#AEB1B7" font-size="14">checks → ML scoring → decision</text>

    <rect x="1160" y="278" width="190" height="118" rx="16" fill="#FFFFFF" stroke="#202023" stroke-width="2"/>
    <text x="1192" y="321" fill="#777A81" font-family="SFMono-Regular, Menlo, monospace" font-size="15">db</text>
    <text x="1192" y="356" fill="#171719" font-size="21" font-weight="700">PostgreSQL</text>
    <text x="1318" y="380" text-anchor="end" fill="#777A81" font-family="SFMono-Regular, Menlo, monospace" font-size="14">:5432</text>

    <rect x="1160" y="435" width="190" height="118" rx="16" fill="#FFFFFF" stroke="#202023" stroke-width="2"/>
    <text x="1192" y="478" fill="#777A81" font-family="SFMono-Regular, Menlo, monospace" font-size="15">vector db</text>
    <text x="1192" y="513" fill="#171719" font-size="21" font-weight="700">Qdrant</text>
    <text x="1318" y="537" text-anchor="end" fill="#777A81" font-family="SFMono-Regular, Menlo, monospace" font-size="14">:6333</text>

    <rect x="1160" y="592" width="190" height="118" rx="16" fill="#FFFFFF" stroke="#202023" stroke-width="2"/>
    <text x="1192" y="635" fill="#777A81" font-family="SFMono-Regular, Menlo, monospace" font-size="15">mock service</text>
    <text x="1192" y="670" fill="#171719" font-size="21" font-weight="700">External API</text>
    <text x="1318" y="694" text-anchor="end" fill="#777A81" font-family="SFMono-Regular, Menlo, monospace" font-size="14">:8100</text>

    <rect x="1515" y="407" width="280" height="174" rx="18" fill="#FFFFFF" stroke="#EF3124" stroke-width="2"/>
    <text x="1555" y="455" fill="#EF3124" font-family="SFMono-Regular, Menlo, monospace" font-size="16">host machine</text>
    <text x="1555" y="497" fill="#171719" font-size="24" font-weight="700">Ollama</text>
    <text x="1555" y="533" fill="#777A81" font-family="SFMono-Regular, Menlo, monospace" font-size="16">LLM + embeddings :11434</text>

    <path d="M240 494H340" fill="none" stroke="#202023" stroke-width="3" marker-end="url(#arrow)"/>
    <text x="290" y="477" text-anchor="middle" fill="#777A81" font-family="SFMono-Regular, Menlo, monospace" font-size="13">HTTP</text>

    <path d="M590 494H650" fill="none" stroke="#EF3124" stroke-width="3" marker-end="url(#arrowRed)"/>
    <text x="620" y="477" text-anchor="middle" fill="#EF3124" font-family="SFMono-Regular, Menlo, monospace" font-size="13">/api</text>

    <path d="M1100 337H1140" fill="none" stroke="#202023" stroke-width="2.5" marker-end="url(#arrow)"/>
    <path d="M1100 494H1140" fill="none" stroke="#202023" stroke-width="2.5" marker-end="url(#arrow)"/>
    <path d="M1100 651H1140" fill="none" stroke="#202023" stroke-width="2.5" marker-end="url(#arrow)"/>

    <path d="M1080 285V220H1430V494H1495" fill="none" stroke="#EF3124" stroke-width="2.5" stroke-dasharray="9 7" marker-end="url(#arrowRed)"/>
    <text x="1400" y="208" text-anchor="end" fill="#EF3124" font-family="SFMono-Regular, Menlo, monospace" font-size="13">OpenAI-compatible / Ollama API</text>

    <line x1="80" y1="872" x2="1810" y2="872" stroke="#D9DADE"/>
    <circle cx="95" cy="917" r="7" fill="#202023"/>
    <text x="115" y="924" fill="#55585F" font-size="16">сплошная линия — HTTP внутри локального стенда</text>
    <line x1="610" y1="917" x2="650" y2="917" stroke="#EF3124" stroke-width="2.5" stroke-dasharray="8 6"/>
    <text x="668" y="924" fill="#55585F" font-size="16">модель запущена вне Docker</text>
    <text x="1795" y="924" text-anchor="end" fill="#171719" font-size="17" font-weight="650">ALFA</text>
  </g>
</svg>
