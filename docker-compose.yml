services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile

    container_name: alfa-backend

    ports:
      - "8000:8000"

    env_file:
      - .env

    environment:
      OLLAMA_BASE_URL: http://host.docker.internal:11434
      OLLAMA_MODEL: qwen3:4b

    restart: unless-stopped