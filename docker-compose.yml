services:
  backend:
    build: ./backend
    container_name: alfa-backend
    ports:
      - "8000:8000"
    env_file:
      - .env
    environment:
      OLLAMA_BASE_URL: http://host.docker.internal:11434
      OLLAMA_MODEL: ${OLLAMA_MODEL}
      OLLAMA_EMBEDDING_MODEL: ${OLLAMA_EMBEDDING_MODEL}
      LLM_PROVIDER: ${LLM_PROVIDER:-ollama}
      LLM_MODEL: ${LLM_MODEL:-}
      LLM_BASE_URL: ${DOCKER_LLM_BASE_URL:-http://host.docker.internal:11434/v1}
      LLM_API_KEY: ${LLM_API_KEY:-ollama}
      LLM_CONTEXT_SIZE: ${LLM_CONTEXT_SIZE:-8192}
      QDRANT_URL: http://qdrant:6333
      QDRANT_COLLECTION: ${QDRANT_COLLECTION:-alfa_knowledge}
      DATABASE_URL: postgresql://alfa:alfa@db:5432/alfa
      EXTERNAL_API_URL: http://external:8100
      UPLOAD_DIR: /app/data/uploads
    volumes:
      - ./data:/app/data
      - ./tests:/backend/system-tests:ro
    depends_on:
      db:
        condition: service_healthy
      qdrant:
        condition: service_started
    restart: unless-stopped

  backend-test:
    profiles: ["test"]
    build: ./backend
    ports:
      - "127.0.0.1:8001:8000"
    env_file:
      - .env
    environment:
      OLLAMA_BASE_URL: http://host.docker.internal:11434
      OLLAMA_MODEL: ${OLLAMA_MODEL}
      OLLAMA_EMBEDDING_MODEL: ${OLLAMA_EMBEDDING_MODEL}
      LLM_PROVIDER: ${LLM_PROVIDER:-ollama}
      LLM_MODEL: ${LLM_MODEL:-}
      LLM_BASE_URL: ${DOCKER_LLM_BASE_URL:-http://host.docker.internal:11434/v1}
      LLM_API_KEY: ${LLM_API_KEY:-ollama}
      LLM_CONTEXT_SIZE: ${LLM_CONTEXT_SIZE:-8192}
      QDRANT_URL: http://qdrant:6333
      QDRANT_COLLECTION: ${QDRANT_COLLECTION:-alfa_knowledge}
      DATABASE_URL: postgresql://alfa:alfa@db:5432/alfa_system_test
      EXTERNAL_API_URL: http://external:8100
      UPLOAD_DIR: /app/data/test-uploads
    volumes:
      - ./data:/app/data
    depends_on:
      db:
        condition: service_healthy
      qdrant:
        condition: service_started
      external:
        condition: service_started
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/openapi.json', timeout=2)"]
      interval: 2s
      timeout: 3s
      retries: 30
      start_period: 10s

  frontend:
    build: ./frontend
    container_name: alfa-frontend
    ports:
      - "8501:8501"
    depends_on:
      - backend
    restart: unless-stopped

  db:
    image: postgres:16
    container_name: alfa-postgres
    ports:
      - "127.0.0.1:5432:5432"
    environment:
      POSTGRES_DB: alfa
      POSTGRES_USER: alfa
      POSTGRES_PASSWORD: alfa
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U alfa -d alfa"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  pgadmin:
    image: dpage/pgadmin4:latest
    container_name: alfa-pgadmin
    ports:
      - "127.0.0.1:5050:80"
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@example.com
      PGADMIN_DEFAULT_PASSWORD: admin
    volumes:
      - pgadmin_data:/var/lib/pgadmin
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped
  
  qdrant:
    image: qdrant/qdrant:v1.19.1
    container_name: alfa-qdrant
    ports: 
      - "127.0.0.1:6333:6333"
    volumes:
      - qdrant_data:/qdrant/storage
    restart: unless-stopped

  ollama:
    image: ollama/ollama:latest
    container_name: alfa-ollama
    ports:
      - "127.0.0.1:11435:11434"
    volumes:
      - ollama_data:/root/.ollama
    restart: unless-stopped

  external:
    build: ./external
    container_name: alfa-external
    ports:
      - "127.0.0.1:8100:8100"

volumes:
  postgres_data:
  pgadmin_data:
  ollama_data:
  qdrant_data:
